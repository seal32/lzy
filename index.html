<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>海不扬波 · 个人作品集</title>
  <!-- 引入 Font Awesome 6 图标库，用于联系方式图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      background-color: #f5f7fa;
      color: #2c3e50;
      line-height: 1.6;
    }

    /* 整体采用柔和的海蓝色调，呼应大海主题 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ----- 顶部导航栏 ----- */
    .navbar {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 40, 70, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 105, 148, 0.1);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      max-width: 1200px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: #0b4f6c;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo i {
      font-size: 2rem;
      color: #1e81b0;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #1e3b4f;
      font-weight: 500;
      font-size: 1.1rem;
      padding: 0.5rem 0;
      position: relative;
      transition: color 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .nav-links a i {
      font-size: 0.9rem;
      color: #5b8ca8;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #1e81b0;
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: #0a3142;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* 移动端菜单适配 */
    @media (max-width: 650px) {
      .nav-container {
        flex-direction: column;
        gap: 12px;
      }
      .nav-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .logo {
        font-size: 1.6rem;
      }
  }

    /* ----- 大图横幅 (大海/船舶主题) ----- */
    .hero {
      background: url('/images/sea.jpg?q=80&w=1200&auto=format&fit=crop') center center/cover no-repeat;
      min-height: 45vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;  /* 四角统一圆角大小，可根据需要调整 */
      margin-bottom: 40px;
      box-shadow: 0 15px 30px rgba(0, 60, 90, 0.25);
      position: relative;
      overflow: hidden;
      background-color: #1b4b6c;
    }

    /* 第二张大图风格：船舶特写，用于移动端也保持氛围 */
    .hero-secondary {
      background: url('/images/pic08.jpg?q=80&w=1200&auto=format&fit=crop') center center/cover no-repeat;
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0 40px;
      border-radius: 20px;  /* 四角统一圆角大小，可根据需要调整 */
      box-shadow: 0 20px 30px rgba(1, 42, 58, 0.3);
    }

    .hero-text {
      color: white;
      text-align: center;
      padding: 20px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    }

    .hero-text p {
      font-size: 1.3rem;
      font-style: italic;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .hero-text h1 {
        font-size: 2.2rem;
        letter-spacing: 4px;
      }
      .hero-secondary {
        min-height: 30vh;
      }
    }

    /* ----- 个人简介栏 ----- */
    .profile-card {
      background: white;
      border-radius: 36px;
      padding: 30px 30px;
      margin: 30px 0 50px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 30px;
      box-shadow: 0 20px 35px rgba(0, 80, 107, 0.1);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(173, 216, 230, 0.3);
    }

    .profile-avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      /* 圆形图标背景图 */
      background-image: url("/images/captain01.png");
      background-size: cover;
      background-position: center;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h2 {
      font-size: 2rem;
      font-weight: 400;
      color: #0b3b4f;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-info p {
      color: #2d4b5c;
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.7;
    }

    @media (max-width: 550px) {
      .profile-card {
        flex-direction: column;
        text-align: center;
      }
      .profile-avatar {
        width: 100px;
        height: 100px;
      }
    }

    /* ----- 联系方式栏（图标链接） ----- */
    .contact-section {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 60px 60px 30px 30px;
      padding: 30px 20px;
      margin: 40px 0 50px;
      box-shadow: 0 15px 30px rgba(8, 75, 99, 0.1);
      text-align: center;
      border: 1px solid rgba(98, 172, 200, 0.25);
    }

    .contact-title {
      font-size: 1.5rem;
      font-weight: 400;
      color: #0a4052;
      margin-bottom: 25px;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2.5rem;
      align-items: center;
    }

    .social-icon {
      font-size: 2.2rem;
      color: #1d5b77;
      transition: all 0.25s ease;
      background: white;
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 8px 18px rgba(0, 80, 100, 0.12);
      text-decoration: none;
    }

    .social-icon:hover {
      color: #ffffff;
      background: #0a4b63;
      transform: translateY(-5px);
      box-shadow: 0 15px 25px rgba(2, 84, 109, 0.35);
    }

    .social-icon i {
      transition: transform 0.2s;
    }

    .social-icon:hover i {
      transform: scale(1.1);
    }

    @media (max-width: 500px) {
      .social-links {
        gap: 1.8rem;
      }
      .social-icon {
        width: 55px;
        height: 55px;
        font-size: 1.9rem;
      }
    }

    /* 内容区域占位风格，简约留白 */
    .section-preview {
      margin: 30px 0 50px;
      padding: 25px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      backdrop-filter: blur(5px);
      text-align: center;
      color: #1d4d60;
      font-style: italic;
    }

    hr {
      border: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, #aac7df, transparent);
      margin: 30px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #496f82;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">
        <i class="fas fa-ship"></i> 海不扬波
      </a>
      <ul class="nav-links">
        <li><a href="/html/portfolio.html"><i class="fas fa-images"></i> 相册</a></li>
        <li><a href="/html/essay1"><i class="fas fa-pen-fancy"></i> 游记</a></li>
        <li><a href="/html/essay2"><i class="fas fa-feather-alt"></i> 杂文</a></li>
        <li><a href="/html/essay3"><i class="fas fa-flask"></i> 科普</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <!-- 大图横幅：大海主题，船舶氛围 -->
    <div class="hero">
      <div class="hero-text">
        <p>逐浪归来 · 海不扬波 · 残阳夕照 · 天涯倦客</p>
      </div>
    </div>

    <!-- 个人简介栏 -->
    <div class="profile-card">
      <div class="profile-avatar" title="航海者头像"></div>
      <div class="profile-info">
        <h2>
          <i class="fas fa-anchor" style="color:#1e81b0;"></i> Captain-Lu
        </h2>
        <p>
          热爱航海与旅行，喜欢用镜头捕捉大海的美景，用文字留住旅途的足迹。
          ——照片、游记、杂文，皆为本人原创，愿与你分享海阔天空的自由。
        </p>
      </div>
    </div>

    <!-- 第二张大图：船舶特写，呼应主题 -->
    <div class="hero-secondary">
      <div class="hero-text">
        <h1 style="font-size:2.5rem;">山海之间</h1>
        <p>每一张照片都是航迹</p>
      </div>
    </div>

    <!-- 简约内容提示（代表相册/游记等区域） -->
    <div class="section-preview">
      <i class="fas fa-water" style="font-size:1.5rem; margin-right:8px;"></i> 
      探索相册 · 阅读游记 · 杂文漫谈 · 航海科普
    </div>

    <!-- 联系方式栏：微信、微博、GitHub、邮箱 -->
    <div class="contact-section">
      <div class="contact-title">
        <i class="fas fa-paper-plane"></i> 找到我 <i class="fas fa-compass"></i>
      </div>
      <div class="social-links">
        <!-- 微信图标 (通常使用微信品牌色) -->
        <a href="/images/weixin.png" class="social-icon" aria-label="微信" title="微信">
          <i class="fab fa-weixin"></i>
        </a>
        <!-- 微博 -->
        <a href="https://weibo.com/u/7728510100" class="social-icon" aria-label="微博" title="微博">
          <i class="fab fa-weibo"></i>
        </a>
        <!-- GitHub -->
        <a href="https://github.com/seal32" class="social-icon" aria-label="GitHub" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <!-- 邮箱 -->
        <a href="mailto:seal32@163.com" class="social-icon" aria-label="邮箱" title="邮箱">
          <i class="fas fa-envelope"></i>
        </a>
      </div>
      <p style="margin-top:20px; color:#3b5e6b; font-size:0.9rem;">
        <i class="far fa-smile"></i> 微信 · 微博 · GitHub · 邮箱
      </p>
    </div>

    <hr>
    <footer>
      <span>© 2026 Captain-Lu · 个人作品集</span> <i class="fas fa-fish" style="margin-left:6px;"></i>
    </footer>
  </main>
</body>
</html>
