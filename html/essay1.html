<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>游记 </title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      background: #fbf7f0;
      background-image: radial-gradient(circle at 20% 30%, rgba(210, 180, 140, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(160, 190, 210, 0.1) 0%, transparent 35%);
      color: #3e3a35;
      line-height: 1.7;
      min-height: 100vh;
    }

    .travel-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 25px 50px;
    }

    /* 游记头部：仿旧地图色调 */
    .travel-header {
      text-align: center;
      margin: 30px 0 40px;
      padding: 35px 20px;
      background: rgba(255, 250, 240, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 40px;
      border: 1px solid #d4b68a;
      box-shadow: 0 15px 30px rgba(139, 90, 43, 0.1);
    }

    .travel-header h1 {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 10px;
      color: #5e4630;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .travel-header h1 i {
      color: #b68b5c;
      font-size: 2.6rem;
    }

    .subtitle {
      font-style: italic;
      color: #7b6e5d;
      margin-top: 12px;
      font-size: 1.15rem;
      letter-spacing: 1px;
    }

    /* 目录卡片 */
    .toc-card {
      background: #fffef9;
      border-radius: 32px;
      padding: 35px 30px;
      margin: 30px 0 50px;
      box-shadow: 0 20px 40px rgba(120, 80, 40, 0.08);
      border-left: 8px solid #c89f6e;
      transition: box-shadow 0.3s;
    }

    .toc-title {
      font-size: 1.9rem;
      font-weight: 400;
      color: #4b3621;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toc-title i {
      color: #b68b5c;
    }

    /* 目录网格：响应式多列 */
    .toc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      list-style: none;
    }

    .toc-link {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fdf8f2;
      padding: 14px 18px;
      border-radius: 18px;
      text-decoration: none;
      color: #4d3e2c;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.25s ease;
      border: 1px solid #e7d5be;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      word-break: break-word;
    }

    .toc-link i {
      font-size: 1.2rem;
      color: #b68b5c;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .toc-link:hover {
      background: #f3e7d9;
      border-color: #c89f6e;
      transform: translateX(6px);
      box-shadow: 0 10px 18px rgba(150, 100, 50, 0.12);
      color: #2e2416;
    }

    /* 文章预览区/提示 */
    .article-preview {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 22px 25px;
      margin: 20px 0 30px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      gap: 12px;
      color: #5e4e3a;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      color: #7b5e42;
      text-decoration: none;
      font-weight: 500;
      background: #f5ede1;
      padding: 12px 22px;
      border-radius: 30px;
      transition: 0.2s;
    }

    .back-home:hover {
      background: #e7d5be;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #8b7b66;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .travel-header h1 {
        font-size: 2.3rem;
        letter-spacing: 5px;
      }
      .toc-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
      }
      .toc-link {
        padding: 12px 14px;
        font-size: 0.95rem;
      }
      .toc-card {
        padding: 25px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="travel-container">
    <!-- 游记头部 -->
    <header class="travel-header">
      <h1>
        <i class="fas fa-suitcase-rolling"></i> 游记
      </h1>
      <p class="subtitle">山河湖海 · 步履不停 · 用文字留住旅途时光</p>
    </header>

    <!-- 文档目录：包含所有提供的游记标题，点击跳转（示例链接，可替换） -->
    <div class="toc-card">
      <div class="toc-title">
        <i class="fas fa-compass"></i> 目录
      </div>
      <ul class="toc-grid" id="travelToc">
        <!-- JavaScript 动态生成目录，保证整洁且易于维护链接 -->
      </ul>
    </div>

    <!-- 提示区域 -->
    <div class="article-preview">
      <i class="fas fa-info-circle" style="font-size:1.4rem; color:#b68b5c;"></i>
      <span>点击上方标题，即可跳转至文章页面。</span>
    </div>

    <a href="https://www.seal32.cn" class="back-home"><i class="fas fa-arrow-left"></i> 返回作品集</a>

    <footer>
      <span>© 2026 海不扬波 · 游记集</span> <i class="fas fa-feather-alt" style="margin-left:6px;"></i>
    </footer>
  </div>


<script>
  (function() {
    // 建立标题与真实链接的映射表
    const linkMapping = {
        "Circular Quay-Chowder Bay": "/html/Circular Quay-Chowder Bay.html",
        "Coogee Beach to Bondi Beach": "/html/Coogee Beach to Bondi Beach.html",
        "202511北京游记": "/html/202511beijing.html",
        "2025-2-2澳大利亚皇家国家公园徒步": "/html/park.html",
        "澳洲塔斯马尼亚游记": "/html/tasimaniya.html",
        "202409山西-内蒙-河北游记": "/html/202409shanxi-neimeng-hebei.html",
        "香港半日游": "/html/xianggang.html",
        "澳门游": "/html/aomen.html",
        "202311阳朔徒步": "/html/202311yangshuotubu.html",
        "202311北海-涠洲岛": "/html/beihai-weizhoudao.html",
        "202309新疆游": "/html/xinjiang.html",
        "202306阳朔徒步": "/html/202306yangshuotubu.html",
        "柳州山水": "/html/liuzhou.html",
        "防城港旅行日记": "/html/fangchenggang.html",
        "牛木线徒步": "/html/niumuxian.html",
        "英西峰林徒步": "/html/yingxifenglin.html",
        "阳朔徒步2": "/html/yangshuo2.html",
        "江西自由行日记": "/html/jiangxi.html",
        "陕西-河南自由行日记": "/html/shanxihenan.html",
        "哈尔滨-雪谷-雪乡游记": "/html/heilongjiang.html",
        "龙脊梯田游记": "/html/longji.html",
        "张家界游记": "/html/zhangjiajie.html",
        "云南-贵阳-柳州游记": "/html/yunnan.html",
        "西北三省旅行日记": "/html/xibei.html",
        "鹿寨香桥一日游": "/html/xiangqiao.html",
        "武汉闲逛": "/html/wuhan.html",
        "三门江森林公园": "/html/sanmenjiang.html",
        "蟠龙山": "/html/panlongshan.html",
        "古亭山": "/html/gutingshan.html",
        "融水行": "/html/rongshui.html",
        "梧州白云山": "/html/baiyunshan.html",
        "桂平西山": "/html/xishan.html",
        "放鸡岛": "/html/fjd.html",
        "硇洲岛": "/html/nzd.html",
        "桂山岛": "/html/guishandao.html",
        "涠洲岛": "/html/weizhoudao.html",
        "老人山": "/html/lrs.html"

      //注意：目录列表最后一项 " 后不加 , 号。
    };

    const travelItems = [
        "Circular Quay-Chowder Bay",
        "Coogee Beach to Bondi Beach",
        "202511北京游记",
        "2025-2-2澳大利亚皇家国家公园徒步",
        "澳洲塔斯马尼亚游记",
        "202409山西-内蒙-河北游记",
        "香港半日游",
        "澳门游",
        "202311阳朔徒步",
        "202311北海-涠洲岛",
        "202309新疆游",
        "202306阳朔徒步",
        "柳州山水",
        "防城港旅行日记",
        "牛木线徒步",
        "英西峰林徒步",
        "阳朔徒步2",
        "江西自由行日记",
        "陕西-河南自由行日记",
        "哈尔滨-雪谷-雪乡游记",
        "龙脊梯田游记",
        "张家界游记",
        "云南-贵阳-柳州游记",
        "西北三省旅行日记",
        "鹿寨香桥一日游",
        "武汉闲逛",
        "三门江森林公园",
        "蟠龙山",
        "古亭山",
        "融水行",
        "梧州白云山",
        "桂平西山",
        "放鸡岛",
        "硇洲岛",
        "桂山岛",
        "涠洲岛",
        "老人山"

      //注意：目录列表最后一项 " 后不加 , 号。

    ];

    const tocContainer = document.getElementById('travelToc');
    if (!tocContainer) return;

    function renderToc() {
      let htmlString = '';
      travelItems.forEach((item, index) => {
        // 从映射表中获取真实链接，如果没有则使用默认链接
        const realLink = linkMapping[item] || `travel-detail.html?title=${encodeURIComponent(item)}`;
        
        const icons = ['fa-mountain', 'fa-tree', 'fa-umbrella-beach', 'fa-hiking', 'fa-campground', 'fa-cloud-sun', 'fa-map-pin'];
        const iconClass = icons[index % icons.length];
        
        htmlString += `
          <li>
            <a href="${realLink}" class="toc-link" target="_blank" rel="noopener noreferrer" title="${item}">
              <i class="fas ${iconClass}"></i> ${item}
            </a>
          </li>
        `;
      });
      tocContainer.innerHTML = htmlString;
    }

    renderToc();
  })();
</script>
</body>
</html>
