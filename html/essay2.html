<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>杂文</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', 'Noto Serif SC', '楷体', 'KaiTi', system-ui, -apple-system, serif;
      background: #f9f7f2;
      background-image: linear-gradient(to bottom, rgba(235, 225, 210, 0.3) 0%, transparent 30%),
                        radial-gradient(circle at 85% 15%, rgba(180, 160, 130, 0.12) 0%, transparent 40%);
      color: #3a3228;
      line-height: 1.8;
      min-height: 100vh;
      letter-spacing: 0.3px;
    }

    .essay-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 25px 50px;
    }

    /* 杂文头部：书卷气息，温润色调 */
    .essay-header {
      text-align: center;
      margin: 30px 0 40px;
      padding: 35px 20px;
      background: rgba(252, 249, 241, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 40px;
      border: 1px solid #d4c9b4;
      box-shadow: 0 15px 30px rgba(100, 80, 50, 0.08);
      position: relative;
      overflow: hidden;
    }

    .essay-header::before {
      content: "";
      position: absolute;
      top: -20px;
      left: -20px;
      width: 120px;
      height: 120px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08"><path d="M20 30 L50 20 L80 30 L75 65 L50 75 L25 65 Z" fill="%23997b55"/></svg>') no-repeat;
      background-size: contain;
      transform: rotate(10deg);
    }

    .essay-header h1 {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 12px;
      color: #5a4a34;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
    }

    .essay-header h1 i {
      color: #9b8765;
      font-size: 2.4rem;
    }

    .subtitle {
      font-style: italic;
      color: #7a6e5a;
      margin-top: 12px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      position: relative;
    }

    /* 目录卡片：羊皮纸风格 */
    .toc-card {
      background: #fefcf7;
      border-radius: 32px;
      padding: 35px 30px;
      margin: 30px 0 50px;
      box-shadow: 0 20px 40px rgba(90, 70, 40, 0.07);
      border: 1px solid #e0d3bd;
      border-left: 8px solid #b8a07a;
      transition: box-shadow 0.3s;
      position: relative;
    }

    .toc-card::after {
      content: "";
      position: absolute;
      bottom: 15px;
      right: 25px;
      font-size: 3rem;
      color: rgba(160, 140, 110, 0.1);
      font-family: serif;
      content: "¶";
    }

    .toc-title {
      font-size: 1.9rem;
      font-weight: 400;
      color: #4a3a24;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Noto Serif SC', '楷体', serif;
    }

    .toc-title i {
      color: #9b8765;
    }

    /* 目录列表：采用垂直排列，体现杂文的随笔感 */
    .toc-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    .toc-link {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #faf6ed;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #3e3525;
      font-weight: 450;
      font-size: 1.05rem;
      transition: all 0.25s ease;
      border: 1px solid #e4d7bf;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.02);
      font-family: 'Noto Serif SC', '楷体', serif;
      letter-spacing: 0.5px;
    }

    .toc-link i {
      font-size: 1.2rem;
      color: #b1976e;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }

    .toc-link .article-date {
      margin-left: auto;
      font-size: 0.8rem;
      color: #9b8b72;
      font-style: italic;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .toc-link:hover {
      background: #f1e8d9;
      border-color: #b8a07a;
      transform: translateX(8px);
      box-shadow: 0 10px 20px rgba(130, 100, 60, 0.1);
      color: #241e12;
    }

    .toc-link:hover i {
      color: #7d623c;
    }

    /* 提示区域 */
    .note-preview {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 20px 25px;
      margin: 20px 0 30px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      gap: 12px;
      color: #5a4e3c;
      border: 1px dashed #cfbea2;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      color: #5e4e34;
      text-decoration: none;
      font-weight: 500;
      background: #efe6d6;
      padding: 12px 24px;
      border-radius: 30px;
      transition: 0.2s;
    }

    .back-home:hover {
      background: #dfd1b8;
      color: #2e2416;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #8e8068;
      font-size: 0.9rem;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .essay-header h1 {
        font-size: 2.4rem;
        letter-spacing: 6px;
      }
      .toc-link {
        flex-wrap: wrap;
        padding: 14px 16px;
      }
      .toc-link .article-date {
        margin-left: 0;
        width: 100%;
        text-align: right;
        font-size: 0.75rem;
      }
      .toc-card {
        padding: 25px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="essay-container">
    <!-- 杂文头部 -->
    <header class="essay-header">
      <h1>
        <i class="fas fa-feather-alt"></i> 杂文
      </h1>
      <p class="subtitle">散墨 · 随笔 · 思绪拾零</p>
    </header>

    <!-- 文档目录：杂文列表 -->
    <div class="toc-card">
      <div class="toc-title">
        <i class="fas fa-book-open"></i> 杂文目录
      </div>
      <ul class="toc-list" id="essayToc">
        <!-- JavaScript动态生成目录 -->
      </ul>
    </div>

    <!-- 提示区域 -->
    <div class="note-preview">
      <i class="fas fa-pen-nib" style="font-size:1.4rem; color:#9b8765;"></i>
      <span>点击上方杂文标题，即可跳转至文章页面。</span>
    </div>

    <a href="https://www.seal32.cn" class="back-home"><i class="fas fa-arrow-left"></i> 返回作品集</a>

    <footer>
      <span>© 2026 海不扬波 · 杂文集</span> <i class="fas fa-quote-right" style="margin-left:6px;"></i>
    </footer>
  </div>

  <script>

      const essayItems = [

        { title: "船上灵异事件-2", link: "/html/lingyi2.html", date: "2022-05-06" },
        { title: "喝酒杂谈", link: "/html/hejiu.html", date: "2009-04-25" },
        { title: "海上警戒监控", link: "/html/warn.html", date: "2022-04-26" },
        { title: "死里逃生", link: "/html/silitaosheng.html", date: "2010-01-24" },
        { title: "怒海惊魂", link: "/html/nuhaijinghun.html", date: "2008-11-26" },

        { title: "实习往事", link: "/html/shixi.html", date: "2022-10-23" },
        { title: "海员", link: "/html/seaman.html", date: "2008-09-06" },
        { title: "航海", link: "/html/sailing.html", date: "2008-09-05" },
        { title: "中秋记忆", link: "/html/zhongqiu.html", date: "2021-09-21" },
        { title: "封控日记-7", link: "/html/fengkong7.html", date: "2022-07-19" },
        { title: "封控日记-6", link: "/html/fengkong6.html", date: "2022-07-16" },
        { title: "封控日记-5", link: "/html/fengkong5.html", date: "2022-07-14" },
        { title: "封控日记-4", link: "/html/fengkong4.html", date: "2022-07-13" },

        { title: "五一劳动节有感", link: "/html/laodongjie.html", date: "2021-05-01" },
        { title: "回到原点", link: "/html/yuandian.html", date: "2011-06-08" },
        { title: "日本地震随想", link: "/html/dizhen.html", date: "2011-03-16" },
        { title: "火灾", link: "/html/huozai.html", date: "2020-09-13" },

        { title: "住院杂记", link: "/html/zhuyuan.html", date: "2018-12-26" },
        { title: "聊聊疫情", link: "/html/yiqing.html", date: "2022-04-21" },
        { title: "篮球场", link: "/html/lanqiuchang.html", date: "2022-04-22" },
        { title: "随想", link: "/html/suixiang.html", date: "2022-04-28" },
        { title: "“鲍迪奇”又来了", link: "/html/20220502.html", date: "2022-05-02" },
        { title: "分别就是永别", link: "/html/20220630.html", date: "2022-06-30" }

      //注意：目录列表最后一项 } 后不加 , 号。

      ];

      const tocContainer = document.getElementById('essayToc');
      if (!tocContainer) return;

      function renderEssayToc() {
        let htmlString = '';
        essayItems.forEach((item) => {
          // 为每个杂文条目设置图标（羽毛笔、书签、墨水等）
          const icons = ['fa-feather', 'fa-bookmark', 'fa-pen', 'fa-highlighter', 'fa-pencil-alt', 'fa-sticky-note'];
          const randomIcon = icons[Math.floor(Math.random() * icons.length)];
          
          htmlString += `
            <li>
              <a href="${item.link}" class="toc-link" target="_blank" rel="noopener noreferrer" title="${item.title}">
                <i class="fas ${randomIcon}"></i> 
                ${item.title}
                <span class="article-date">${item.date}</span>
              </a>
            </li>
          `;
        });
        tocContainer.innerHTML = htmlString;
      }

      renderEssayToc();
    })();
  </script>
</body>
</html>
