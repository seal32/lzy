<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>相册作品集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      color: #1e3b4f;
      line-height: 1.5;
      padding: 20px;
    }

    .portfolio-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-weight: 400;
      font-size: 2.2rem;
      letter-spacing: 4px;
      margin: 20px 0 35px;
      color: #0b4f6c;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h1 i {
      color: #1e81b0;
      font-size: 2rem;
    }

    /* 相册网格：采用CSS Grid自动适配，图片保持原始宽高比但统一宽度限制 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 50px;
    }

    /* 相册卡片 */
    .album-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0, 70, 100, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .album-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 40px rgba(0, 90, 120, 0.15);
    }

    /* 图片容器：保持不同尺寸图片美观显示，图片本身按原始比例缩放并裁剪 */
    .image-wrapper {
      width: 100%;
      overflow: hidden;
      background: #e2ebf0;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 420 / 286; /* 默认比例，但实际图片会通过object-fit覆盖 */
      position: relative;
    }

    /* 图片样式：使用object-fit cover保证填满容器且不变形，不同图片自然显示 */
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .album-card:hover .image-wrapper img {
      transform: scale(1.03);
    }

    /* 相册名称标签 */
    .album-title {
      padding: 16px 18px;
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
      background: white;
      letter-spacing: 1px;
      color: #0a4052;
      border-top: 1px solid rgba(173, 216, 230, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .album-title i {
      font-size: 0.9rem;
      color: #5b8ca8;
    }

    /* 响应式调整：小屏幕时网格更紧凑 */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }
      .album-title {
        font-size: 0.95rem;
        padding: 12px 10px;
      }
    }

    /* 提示文本 */
    .group-divider {
      grid-column: 1 / -1;
      text-align: left;
      font-size: 1.3rem;
      font-weight: 400;
      color: #2c5b6e;
      margin: 15px 0 5px;
      padding-left: 8px;
      border-left: 4px solid #1e81b0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-divider i {
      color: #1e81b0;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #5b7e8c;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="portfolio-container">
    <h1>
      <i class="fas fa-images"></i> 光影行迹
    </h1>

    <!-- 相册网格：包含4组，每组6张图片，按指定尺寸顺序排列 -->
    <div class="gallery-grid" id="albumGrid">
      <!-- 通过JavaScript动态生成，确保结构清晰且易于修改链接 -->
    </div>

    <footer>
      <span>© 2026 Captain-Lu · 相册集</span> <i class="fas fa-camera-retro" style="margin-left: 6px;"></i>
    </footer>
  </div>

  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <script>
    (function() {
      // 定义图片数据：每组按照指定顺序：pic02(420x286), pic04(420x460), pic06(420x221), pic03(420x283), pic05(420x235), pic07(420x364)
      // 使用占位图服务生成对应尺寸图片，颜色主题为海洋/船舶色调，保留图片原始比例。
      // 同时为每张图片设置自定义链接（这里使用示例链接，可替换为真实链接）
      
      const groups = [
        {
          groupName: "第一组",
          images: [
            { src: "/images/pic02.jpg", alt: "澳大利亚掠影", link: "/html/au.html", title: "澳大利亚掠影" },
            { src: "/images/pic04.jpg", alt: "贵州-云南", link: "/html/footprint1.html", title: "贵州-云南" },
            { src: "/images/pic06.jpg", alt: "湖南-北京-上海", link: "/html/footprint2.html", title: "湖南-北京-上海" },
            { src: "/images/pic03.jpg", alt: "海为龙世界  天是鹤家乡", link: "/html/sea.html", title: "海为龙世界  天是鹤家乡" },
            { src: "/images/pic05.jpg", alt: "监造", link: "/html/buildship.html", title: "监造" },
            { src: "/images/pic07.jpg", alt: "青海-兰州-宁夏-扬州-厦门-天津-青岛-浙江", link: "/html/footprint3.html", title: "青海-兰州-宁夏-扬州-厦门-天津-青岛-浙江" }
          ]
        },
        {
          groupName: "第二组",
          images: [
            { src: "https://picsum.photos/420/286?random=20", alt: "相册7", link: "https://example.com/album7", title: "相册7" },
            { src: "https://picsum.photos/420/460?random=21", alt: "相册8", link: "https://example.com/album8", title: "相册8" },
            { src: "https://picsum.photos/420/221?random=22", alt: "相册9", link: "https://example.com/album9", title: "相册9" },
            { src: "https://picsum.photos/420/283?random=23", alt: "相册10", link: "https://example.com/album10", title: "相册10" },
            { src: "https://picsum.photos/420/235?random=24", alt: "相册11", link: "https://example.com/album11", title: "相册11" },
            { src: "https://picsum.photos/420/364?random=25", alt: "相册12", link: "https://example.com/album12", title: "相册12" }
          ]
        },
        {
          groupName: "第三组",
          images: [
            { src: "https://picsum.photos/420/286?random=30", alt: "相册13", link: "https://example.com/album13", title: "相册13" },
            { src: "https://picsum.photos/420/460?random=31", alt: "相册14", link: "https://example.com/album14", title: "相册14" },
            { src: "https://picsum.photos/420/221?random=32", alt: "相册15", link: "https://example.com/album15", title: "相册15" },
            { src: "https://picsum.photos/420/283?random=33", alt: "相册16", link: "https://example.com/album16", title: "相册16" },
            { src: "https://picsum.photos/420/235?random=34", alt: "相册17", link: "https://example.com/album17", title: "相册17" },
            { src: "https://picsum.photos/420/364?random=35", alt: "相册18", link: "https://example.com/album18", title: "相册18" }
          ]
        },
        {
          groupName: "第四组",
          images: [
            { src: "https://picsum.photos/420/286?random=40", alt: "相册19", link: "https://example.com/album19", title: "相册19" },
            { src: "https://picsum.photos/420/460?random=41", alt: "相册20", link: "https://example.com/album20", title: "相册20" },
            { src: "https://picsum.photos/420/221?random=42", alt: "相册21", link: "https://example.com/album21", title: "相册21" },
            { src: "https://picsum.photos/420/283?random=43", alt: "相册22", link: "https://example.com/album22", title: "相册22" },
            { src: "https://picsum.photos/420/235?random=44", alt: "相册23", link: "https://example.com/album23", title: "相册23" },
            { src: "https://picsum.photos/420/364?random=45", alt: "相册24", link: "https://example.com/album24", title: "相册24" }
          ]
        }
      ];

      const gridContainer = document.getElementById('albumGrid');
      
      function renderPortfolio() {
        if (!gridContainer) return;
        let htmlString = '';
        
        groups.forEach((group, groupIndex) => {
          // 添加组标题
          htmlString += `<div class="group-divider"><i class="fas fa-water"></i> ${group.groupName}</div>`;
          
          group.images.forEach((imgData) => {
            // 每个卡片使用a标签，点击打开自定义链接，target="_blank"在新窗口打开
            htmlString += `
              <a href="${imgData.link}" target="_blank" rel="noopener noreferrer" class="album-card">
                <div class="image-wrapper">
                  <img src="${imgData.src}" alt="${imgData.alt}" loading="lazy">
                </div>
                <div class="album-title">
                  <i class="far fa-image"></i> ${imgData.title}
                </div>
              </a>
            `;
          });
        });
        
        gridContainer.innerHTML = htmlString;
      }

      // 页面加载完成后渲染
      window.addEventListener('DOMContentLoaded', renderPortfolio);
    })();
  </script>
</body>
</html>
