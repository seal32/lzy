<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳洲-3 · 2026澳大利亚</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f5f0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 2.5rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #2e2e2e;
        }

        .portfolio {
            max-width: 1440px;
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #1e1e1e;
            border-bottom: 2px solid #c7b9a8;
            display: inline-block;
            padding-bottom: 0.4rem;
            margin-bottom: 0.5rem;
            font-family: 'Times New Roman', 'Songti SC', serif;
        }

        .page-header .sub-title {
            font-size: 1.1rem;
            color: #6b625a;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 300;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem 1.8rem;
        }

        .photo-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(210, 200, 188, 0.3);
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 30px -8px rgba(0, 0, 0, 0.12), 0 6px 12px rgba(0, 0, 0, 0.05);
        }

        .photo-link {
            display: block;
            line-height: 0;
            background-color: #eae5dd;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .photo-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s, transform 0.4s ease;
            display: block;
        }

        .photo-link:hover img {
            opacity: 0.92;
            transform: scale(1.01);
        }

        .caption-area {
            padding: 1rem 1.2rem 1.2rem;
            background: #fff;
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.35rem;
        }

        .editable-caption {
            width: 100%;
            font-size: 1rem;
            line-height: 1.5;
            color: #3d3a36;
            border: 1px dashed #ddd6cd;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            background-color: #fefefe;
            font-weight: 400;
            letter-spacing: 0.01em;
            word-break: break-word;
            min-height: 2.8em;
            cursor: text;
            caret-color: #9b7b5c;
        }

        .editable-caption:hover,
        .editable-caption:focus {
            border-color: #b7a99a;
            background-color: #ffffff;
            border-style: solid;
        }

        .caption-hint {
            font-size: 0.65rem;
            color: #b1a69b;
            letter-spacing: 0.3px;
            margin-top: 0.1rem;
            text-align: right;
            opacity: 0.6;
            transition: opacity 0.2s;
            align-self: flex-end;
            user-select: none;
        }

        .photo-card:hover .caption-hint {
            opacity: 0.9;
        }

        .page-footer {
            margin-top: 3.5rem;
            text-align: center;
            border-top: 1px solid #e0d9d0;
            padding-top: 2rem;
            width: 100%;
        }

        .back-link {
            display: inline-block;
            padding: 0.8rem 2.2rem;
            background-color: transparent;
            border: 1.5px solid #b7a99a;
            border-radius: 40px;
            color: #4e443b;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            font-family: 'Times New Roman', 'Songti SC', serif;
        }

        .back-link:hover {
            background-color: #b7a99a;
            color: #fff;
            border-color: #b7a99a;
        }

        /* 图片加载失败时显示路径的小提示，方便排查 */
        .img-error-tip {
            font-size: 0.65rem;
            color: #a08e7c;
            background: #f2ede7;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-top: 0.2rem;
            word-break: break-all;
            display: none;
        }

        .photo-card.has-error .img-error-tip {
            display: block;
        }

        @media (max-width: 600px) {
            body {
                padding: 1.5rem 1rem 3rem;
            }
            .page-header h1 {
                font-size: 2rem;
            }
            .photo-grid {
                gap: 1.5rem;
            }
            .caption-area {
                padding: 0.8rem 1rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="portfolio">
        <header class="page-header">
            <h1>2026澳大利亚</h1>
            <div class="sub-title">澳洲-3</div>
        </header>

        <div class="photo-grid" id="photoGrid"></div>

        <footer class="page-footer">
            <a href="/html/portfolio" class="back-link">← 点击返回相册集</a>
        </footer>
    </div>

    <script>
        (function() {
            const IMAGE_COUNT = 63;
            // 保持你原有的图片文件夹路径：2026-au-2
            const BASE_PATH = '/images/2026-au-2/';

            const grid = document.getElementById('photoGrid');

            const DEFAULT_CAPTIONS = [
                '2026-08-28 库吉海滩',
                '2026-08-28 库吉海滩→邦迪海滩徒步',
                '2026-08-28 库吉海滩→邦迪海滩徒步',
                '2026-08-28 库吉海滩→邦迪海滩徒步',
                '2026-08-28 库吉海滩→邦迪海滩徒步',
                '2026-08-28 库吉海滩→邦迪海滩徒步',
                '2026-08-28 邦迪海滩',
                '2026-09-04 环形码头-塔龙加码头轮渡上看悉尼歌剧院',
                '2026-09-04 塔龙加码头→茶德湾徒步',
                '2026-09-04 塔龙加码头→茶德湾徒步',
                '2026-09-04 塔龙加码头→茶德湾徒步',
                '2026-09-04 塔龙加码头→茶德湾徒步',
                '2026-09-04 茶德湾',
                '2026-09-13 斯皮特桥',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-13 斯皮特桥→曼利徒步',
                '2026-09-20 女王大厦',
                '2026-09-20 女王大厦',
                '2026-09-20 海德公园 . 悉尼电视塔',
                '2026-09-20 海德公园 . 圣玛利亚大教堂',
                '2026-09-20 海德公园 . 喷水池',
                '2026-09-20 圣玛利亚大教堂',
                '2026-09-20 悉尼港湾大桥',
                '2026-10-04 Cronulla 海岸',
                '2026-10-09 Cronulla 植物学湾海岸炮台',
                '2026-10-12 Cronulla Beach',
                '2026-10-12 Cronulla Beach',
                '2026-10-12 Cronulla Beach',
                '2026-10-12 Cronulla Beach',
                '2026-10-18 傍晚.海港大桥上看悉尼歌剧院',
                '2026-10-18 傍晚.海港大桥上看悉尼歌剧院',
                '2026-10-18 傍晚.海港大桥上看悉尼歌剧院',
                '2026-10-18 傍晚.海港大桥上看悉尼歌剧院',
                '2026-10-18 傍晚.海港大桥上看悉尼歌剧院',
                '2026-10-18 傍晚.海港大桥',
                '2026-10-18 傍晚.悉尼歌剧院',
                '2026-10-22 Milson Park 蓝花楹',
                '2026-10-22 Milson Park',
                '2026-10-22 Wendy Whiteley\'s Secret Garden',
                '2026-10-22 Lavender Bay',
                '2026-10-22 Lavender Bay',
                '2026-10-22 Circular Quay',
                '2026-10-22 Circular Quay',
                '2026-10-30 悉尼-春花盛开',
                '2026-11-4 Coalcliff→Womborra徒步-海崖大桥',
                '2026-11-4 Coalcliff→Womborra徒步-海崖大桥',
                '2026-11-4 Coalcliff→Womborra徒步-海崖大桥',
                '2026-11-4 Coalcliff→Womborra徒步-海崖大桥',
                '2026-11-4 Coalcliff→Womborra徒步-海崖大桥',
                '2026-11-4 Coalcliff→Womborra徒步-海崖大桥',
                '2026-11-4 Coalcliff→Womborra徒步-鹦鹉',
                '2026-11-4 Coalcliff→Womborra徒步-百年酒馆scarborough hotel',
                '2026-11-4 Coalcliff→Womborra徒步-Scarborough Beach海岸',
                '2026-11-4 Coalcliff→Womborra徒步-Wombarra Beach',
                '2026-11-7 Kyeemagh Rock Jetty'
            ];

            for (let i = 1; i <= IMAGE_COUNT; i++) {
                const num = i.toString().padStart(2, '0');
                const imagePath = `${BASE_PATH}${num}.jpg`;

                // 控制台输出每张图的完整 URL，方便在 F12 中核对
                console.log(`[图片 ${num}] ${window.location.origin}${imagePath}`);

                const defaultCaption = i <= DEFAULT_CAPTIONS.length 
                    ? DEFAULT_CAPTIONS[i - 1] 
                    : '澳大利亚 · 记忆';

                const card = document.createElement('div');
                card.className = 'photo-card';

                const photoLink = document.createElement('a');
                photoLink.className = 'photo-link';
                photoLink.href = imagePath;
                photoLink.target = '_blank';
                photoLink.rel = 'noopener noreferrer';

                const img = document.createElement('img');
                img.src = imagePath;
                img.alt = `澳大利亚风景 ${num}`;
                img.loading = 'lazy';

                // 加载失败时：显示占位图 + 在卡片底部显示实际请求路径
                img.onerror = function() {
                    this.style.backgroundColor = '#e5dfd8';
                    this.alt = '图片加载失败';
                    this.src = 'data:image/svg+xml,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">' +
                        '<rect width="400" height="300" fill="#eae5dd"/>' +
                        '<text x="200" y="140" font-family="Arial" font-size="20" fill="#9a8e80" text-anchor="middle">📷 图片未找到</text>' +
                        '<text x="200" y="180" font-family="Arial" font-size="12" fill="#a89f96" text-anchor="middle">请检查文件是否存在</text>' +
                        '</svg>'
                    );
                    // 给卡片加错误标记
                    card.classList.add('has-error');
                    // 更新错误提示中的路径
                    const tip = card.querySelector('.img-error-tip');
                    if (tip) {
                        tip.textContent = '请求路径: ' + imagePath;
                    }
                };

                photoLink.appendChild(img);

                const captionArea = document.createElement('div');
                captionArea.className = 'caption-area';

                const editableCaption = document.createElement('div');
                editableCaption.className = 'editable-caption';
                editableCaption.contentEditable = 'true';
                editableCaption.textContent = defaultCaption;
                editableCaption.setAttribute('spellcheck', 'false');
                editableCaption.setAttribute('role', 'textbox');
                editableCaption.setAttribute('aria-label', '可编辑图片说明');

                // 图片加载失败时显示路径的提示元素（默认隐藏）
                const errorTip = document.createElement('div');
                errorTip.className = 'img-error-tip';
                errorTip.textContent = '';

                const hintSpan = document.createElement('span');
                hintSpan.className = 'caption-hint';
                hintSpan.textContent = '✎ 点击编辑说明';

                captionArea.appendChild(editableCaption);
                captionArea.appendChild(errorTip);
                captionArea.appendChild(hintSpan);

                card.appendChild(photoLink);
                card.appendChild(captionArea);

                grid.appendChild(card);
            }
        })();
    </script>
</body>
</html>
