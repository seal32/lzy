<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>科普</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background: #f0f5f9;
      background-image: 
        linear-gradient(135deg, rgba(30, 129, 176, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 20%, rgba(11, 79, 108, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 30% 80%, rgba(100, 180, 210, 0.07) 0%, transparent 35%);
      color: #1a3b4b;
      line-height: 1.7;
      min-height: 100vh;
    }

    .science-container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 20px 25px 50px;
    }

    /* 科普头部：理性、现代、海洋科学风格 */
    .science-header {
      text-align: center;
      margin: 30px 0 40px;
      padding: 35px 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 36px;
      border: 1px solid rgba(30, 129, 176, 0.25);
      box-shadow: 0 15px 35px rgba(0, 80, 120, 0.1);
      position: relative;
      overflow: hidden;
    }

    .science-header::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 150px;
      height: 150px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.06"><circle cx="50" cy="50" r="40" fill="none" stroke="%231e81b0" stroke-width="2"/><circle cx="50" cy="50" r="25" fill="none" stroke="%231e81b0" stroke-width="1.5"/><circle cx="50" cy="50" r="10" fill="%231e81b0"/><line x1="50" y1="10" x2="50" y2="0" stroke="%231e81b0" stroke-width="2"/><line x1="90" y1="50" x2="100" y2="50" stroke="%231e81b0" stroke-width="2"/></svg>') no-repeat;
      background-size: contain;
    }

    .science-header h1 {
      font-size: 3rem;
      font-weight: 350;
      letter-spacing: 10px;
      color: #0b4f6c;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
    }

    .science-header h1 i {
      color: #1e81b0;
      font-size: 2.3rem;
    }

    .subtitle {
      color: #3b6e85;
      margin-top: 12px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 400;
      position: relative;
    }

    /* 目录卡片：科技感玻璃效果 */
    .toc-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 32px;
      padding: 35px 30px;
      margin: 30px 0 50px;
      box-shadow: 0 20px 40px rgba(0, 70, 100, 0.08);
      border: 1px solid rgba(30, 129, 176, 0.2);
      border-left: 8px solid #1e81b0;
    }

    .toc-title {
      font-size: 1.8rem;
      font-weight: 400;
      color: #0a4052;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toc-title i {
      color: #1e81b0;
    }

    /* 目录网格：卡片式布局 */
    .toc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      list-style: none;
    }

    .toc-link {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #1a4b5e;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.25s ease;
      border: 1px solid rgba(30, 129, 176, 0.18);
      box-shadow: 0 4px 12px rgba(0, 100, 140, 0.04);
      letter-spacing: 0.3px;
    }

    .toc-link i {
      font-size: 1.3rem;
      color: #1e81b0;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    .toc-link .category-tag {
      margin-left: auto;
      font-size: 0.7rem;
      background: rgba(30, 129, 176, 0.12);
      color: #0f5b78;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .toc-link:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #1e81b0;
      transform: translateY(-3px);
      box-shadow: 0 14px 25px rgba(0, 110, 150, 0.12);
      color: #072a36;
    }

    .toc-link:hover i {
      color: #0a5f7c;
    }

    /* 提示区域 */
    .info-banner {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 20px 25px;
      margin: 20px 0 30px;
      box-shadow: 0 8px 18px rgba(0, 70, 100, 0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      color: #2b6176;
      border: 1px solid rgba(30, 129, 176, 0.15);
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      color: #1d5b77;
      text-decoration: none;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      padding: 12px 24px;
      border-radius: 30px;
      transition: 0.2s;
      border: 1px solid rgba(30, 129, 176, 0.2);
    }

    .back-home:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #1e81b0;
      color: #083c4f;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #4b7a8e;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .science-header h1 {
        font-size: 2.3rem;
        letter-spacing: 6px;
      }
      .toc-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .toc-link {
        padding: 14px 16px;
        font-size: 0.95rem;
      }
      .toc-card {
        padding: 25px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="science-container">
    <!-- 科普头部 -->
    <header class="science-header">
      <h1>
        <i class="fas fa-flask"></i> 科普
      </h1>
      <p class="subtitle">探索 · 学习 · 航海 · 自然</p>
    </header>

    <!-- 科普文章目录 -->
    <div class="toc-card">
      <div class="toc-title">
        <i class="fas fa-microscope"></i> 目录
      </div>
      <ul class="toc-grid" id="scienceToc">
        <!-- JavaScript动态生成目录 -->
      </ul>
    </div>

    <!-- 提示区域 -->
    <div class="info-banner">
      <i class="fas fa-lightbulb" style="font-size:1.5rem; color:#1e81b0;"></i>
      <span>点击上方标题，即可跳转至文章页面。</span>
    </div>

    <a href="https://www.seal32.cn" class="back-home"><i class="fas fa-arrow-left"></i> 返回作品集</a>

    <footer>
      <span>© 2026 海不扬波 · 科普集</span> <i class="fas fa-atom" style="margin-left:8px;"></i>
    </footer>
  </div>

  <script>
    (function() {
      // 科普文章数据：标题、链接、分类标签
      const scienceItems = [
        { title: "从洋流看日本排放核废水的影响", link: "/html/yangliu.html", category: "海洋" },
        { title: "船舶定位", link: "/html/position.html", category: "船舶" },
        { title: "航标作业", link: "/html/hangbiaozuoye.html", category: "船舶" },
        { title: "航标", link: "/html/buoy.html", category: "浮标" },
        { title: "航海雷达简介", link: "/html/radar.html", category: "船舶" },
        { title: "DGPS在浮标定位中的应用", link: "/html/dgps.html", category: "船舶" },
        { title: "参考资料-锚系、沉块抓持力计算", link: "/html/Anchor Holding Power.html", category: "船舶" },
        { title: "台风", link: "/html/taifeng.html", category: "气象" },
        { title: "寒潮", link: "/html/hanchao.html", category: "气象" },
        { title: "参考资料-风浪等级表", link: "/html/fenglangbiao.html", category: "气象" },
        { title: "户外地图软件", link: "/html/map.html", category: "地图" },
        { title: "推荐几个实用软件", link: "/html/ruanjian.html", category: "科技" },
        { title: "音响", link: "/html/yinxiang.html", category: "音响" },
        { title: "用电脑播放SACD镜像文件的方法", link: "/html/sacd.html", category: "音响" },
        { title: "废物利用-玩转手机HIFI", link: "/html/shouji-hifi.html", category: "音响" },
        { title: "自建电视直播频道", link: "/html/iptv.html", category: "电视" },
        { title: "观影看剧神器—TVBox", link: "/html/tvbox.html", category: "电视" },
        { title: "如何搭建个人网站", link: "/html/wangzhandajian.html", category: "笔记" },
        { title: "GIT使用摘要备忘", link: "/html/git.html", category: "备忘" },
        { title: "MarkdownPad用法备忘", link: "/html/MarkdownPad.html", category: "备忘" },
        { title: "HTML常用代码备忘", link: "/html/html code.html", category: "备忘" }

      //注意：目录列表最后一项 } 后不加 , 号。

      ];

      const tocContainer = document.getElementById('scienceToc');
      if (!tocContainer) return;

      function renderScienceToc() {
        let htmlString = '';
        scienceItems.forEach((item) => {
          // 根据分类分配不同图标
          const categoryIcons = {
            '海洋': 'fa-water',
            '船舶': 'fa-ship',
            '浮标': 'fa-life-ring',
            '灯塔': 'fa-lighthouse',
            '地图': 'fa-map-marked',
            '电视': 'fa-tv',
            '音响': 'fa-headphones',
            '笔记': 'fa-book',
            '气象': 'fa-cloud-sun-rain',
            '科技': 'fa-satellite',
            '备忘': 'fa-sticky-note',
            '天文': 'fa-moon',
            '气候': 'fa-temperature-high'

      //注意：列表最后一项 ' 后不加 , 号。
          };
          const iconClass = categoryIcons[item.category] || 'fa-microscope';
          
          htmlString += `
            <li>
              <a href="${item.link}" class="toc-link" target="_blank" rel="noopener noreferrer" title="${item.title}">
                <i class="fas ${iconClass}"></i> 
                ${item.title}
                <span class="category-tag">${item.category}</span>
              </a>
            </li>
          `;
        });
        tocContainer.innerHTML = htmlString;
      }

      renderScienceToc();
    })();
  </script>
</body>
</html>
